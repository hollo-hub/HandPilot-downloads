name: Build and publish HandPilot

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: false
        default: v0.1.4

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hollo-hub/HandPilot
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: source
        run: python -m pip install -e ".[test,windows,build]"
      - name: Test
        working-directory: source
        run: python -m pytest
      - name: Build
        working-directory: source
        run: python -m PyInstaller --clean --noconfirm --distpath "$env:GITHUB_WORKSPACE\dist" GestureControl.spec
      - name: Rename
        shell: pwsh
        run: Rename-Item "dist\HandPilot.exe" "HandPilot.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: HandPilot-windows
          path: dist/HandPilot.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hollo-hub/HandPilot
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: source
        run: python -m pip install -e ".[test,build]"
      - name: Test
        working-directory: source
        run: python -m pytest
      - name: Build
        working-directory: source
        run: python -m PyInstaller --clean --noconfirm --distpath "$GITHUB_WORKSPACE/dist" GestureControl.spec
      - name: Package
        run: tar -czf HandPilot-linux-x86_64.tar.gz -C dist HandPilot
      - uses: actions/upload-artifact@v4
        with:
          name: HandPilot-linux
          path: HandPilot-linux-x86_64.tar.gz

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            release-assets/HandPilot-windows/HandPilot.exe \
            release-assets/HandPilot-linux/HandPilot-linux-x86_64.tar.gz \
            --repo "${{ github.repository }}" \
            --title "HandPilot ${{ inputs.version }}" \
            --notes "Cross-platform HandPilot release. See the source README for runtime limitations and feedback instructions."
